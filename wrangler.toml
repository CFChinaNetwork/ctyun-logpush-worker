# ═══ 每域名部署前【必改 / 必填】(PER-DOMAIN CHECKLIST) ═══
#   1) name = "<domain>-com-log"
#   2) account_id = 该域名所在账号(ss_vivo_static / ss_vivo_dynamic)
#   3) [[r2_buckets]].bucket_name 与 [vars].R2_BUCKET_NAME = "<domain>-com"(两处一致)
#   4) 4 个队列名统一加 <domain> 后缀(2 producers + 4 consumers + 4 个 *_QUEUE_NAME/*_DLQ_NAME):
#      parse-queue / send-queue / parse-dlq / send-dlq-<domain>
#   5) [vars].FIELD11_SERVER_IP = 该域名 anycast IP(第 11 字段,【必填】,如 172.65.90.64)
#   6) 3 个 secret:wrangler secret put CTYUN_ENDPOINT / CTYUN_PRIVATE_KEY / CTYUN_URI_EDGE
#   其余 [vars] 保持默认。设计依据 / 调参原理见 docs/。

name = "ctyun-logpush"                              # 改成 "<domain>-com-log"
account_id = "0297df3199a94c8082d099ac2212c40a"     # 改成该域名所在账号 ID
main = "src/index.js"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]
workers_dev  = false
logpush = true                                      # Workers Trace Events Logpush(需账号侧已建 job 才落数据)

# cron 每分钟驱动 scheduled() 补扫,兜底「R2 事件通知漏/晚」的对象。⚠️必须保留(置空=退回纯事件驱动→偶发 gap)。
[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding     = "RAW_BUCKET"
bucket_name = "cdn-logs-raw"                        # 改成 "<domain>-com",与 [vars].R2_BUCKET_NAME 一致

[[queues.producers]]
binding = "PARSE_QUEUE"
queue   = "parse-queue"

[[queues.producers]]
binding = "SEND_QUEUE"
queue   = "send-queue"

# parse 消费者:有界并发池(同一 invocation 内最多 [vars].PARSE_PARALLELISM 个文件并行解析,提吞吐)。
# max_batch_size 须 ≥ PARSE_PARALLELISM 才喂满池(=1 退化串行);每文件流式+每 BATCH_SIZE flush,峰值内存≈P×数十MB。
# max_concurrency 不设:由 autoscaler 横向扩(每队列上限 250)。
[[queues.consumers]]
queue              = "parse-queue"                  # 与 producer / [vars].PARSE_QUEUE_NAME 一致
max_batch_size     = 2
max_batch_timeout  = 5
max_retries        = 5
dead_letter_queue  = "parse-dlq"

[[queues.consumers]]
queue              = "send-queue"                   # 与 producer / [vars].SEND_QUEUE_NAME 一致
max_batch_size     = 50
max_batch_timeout  = 5
max_retries        = 5
dead_letter_queue  = "send-dlq"

# DLQ 自动重驱动:死信延迟回灌源队列、自愈;本身不设 dead_letter_queue。
[[queues.consumers]]
queue              = "parse-dlq"                    # 与 [vars].PARSE_DLQ_NAME 一致
max_batch_size     = 10
max_batch_timeout  = 30
max_retries        = 10
max_concurrency    = 1

[[queues.consumers]]
queue              = "send-dlq"                     # 与 [vars].SEND_DLQ_NAME 一致
max_batch_size     = 10
max_batch_timeout  = 30
max_retries        = 10
max_concurrency    = 1

# 4 个队列名须与上方 consumers/producers 一致;FIELD11_SERVER_IP【必填】,其余默认。
[vars]
PARSE_QUEUE_NAME = "parse-queue"
SEND_QUEUE_NAME  = "send-queue"
PARSE_DLQ_NAME   = "parse-dlq"
SEND_DLQ_NAME    = "send-dlq"
R2_BUCKET_NAME   = "cdn-logs-raw"                   # 与上方 [[r2_buckets]] bucket_name 一致
FIELD11_SERVER_IP = ""                              # 【必填】该域名 anycast IP(第 11 字段);空则输出 "-"
BATCH_SIZE       = "2000"                           # ⚠️ 改此值前须先清空 DLQ(否则破坏 .done 幂等)
RAW_LOG_PREFIX   = "logs/"
RAW_LOG_SUFFIX   = ".log.gz"
LOG_LEVEL        = "info"
SEND_PARALLELISM = "2"                              # send 单次 invocation 并行【发送】度(1=串行,上限 8)
PARSE_PARALLELISM = "2"                             # parse 单次 invocation 并行【解析】度(有界并发池;须 ≤ parse max_batch_size;上限 8)
SEND_FETCH_TIMEOUT_MS = "120000"                    # 单次发送 fetch 超时(ms)
PARSE_READ_IDLE_TIMEOUT_MS = "45000"                # 单次 R2 read() 空闲超时(ms);卡死才触发,与对象大小无关;超时只重试该文件。0=不限
RECONCILE_LOOKBACK_MINUTES = "60"                   # 补扫回看窗口(min):覆盖事件通知最大延迟(实测 ≤53min)
RECONCILE_GRACE_SECONDS    = "120"                  # 宽限(s):落桶不足此时长先交给事件路径,避免竞争重复
RECONCILE_MAX_ENQUEUE      = "100"                  # 单次补扫最多回灌对象数(防一次性回灌过多)
RETRY_DELAY_SECONDS = "15"                          # 失败重试延迟(s)
REDRIVE_BASE_DELAY_SECONDS = "20"                   # DLQ 重驱动退避基数(s)
REDRIVE_MAX_DELAY_SECONDS  = "120"                  # DLQ 重驱动退避封顶(s)
REDRIVE_JITTER_SECONDS     = "10"                   # DLQ 重驱动抖动(s)

# Observability:100% 采样 + 持久化 Logs(事故回看)
[observability]
enabled = true
head_sampling_rate = 1
[observability.logs]
enabled         = true
invocation_logs = true

# CPU 上限:Enterprise 最大 300000ms(给大文件域名余量)
[limits]
cpu_ms = 300000
