# ═══════════════════════════════════════════════════════════════════════════
#  ctyun-logpush-worker — 每个域名部署一份。
#  带【按域名修改】/【按域名必填】标记的是每次部署要替换的项；其余保持默认即可。
# ═══════════════════════════════════════════════════════════════════════════
name = "ctyun-logpush"          # 【按域名修改】Worker 名，建议 <domain>-com-log
account_id = "0297df3199a94c8082d099ac2212c40a"  # 【按域名修改】该域名所在的 Cloudflare Account ID
main = "src/index.js"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]
workers_dev  = false

# ─── R2 存储桶 ───────────────────────────────────────────────────────────────
# binding = "RAW_BUCKET" 不要改（代码通过它访问 R2）。
# bucket_name 按域名改，并与下方 [vars].R2_BUCKET_NAME 保持一致。
[[r2_buckets]]
binding     = "RAW_BUCKET"
bucket_name = "cdn-logs-raw"    # 【按域名修改】建议 <domain>-com

# ─── Queue 生产者 ─────────────────────────────────────────────────────────────
# binding 不要改。queue 名按域名改，并与下方 consumers、[vars].*_QUEUE_NAME 三处保持一致。
[[queues.producers]]
binding = "PARSE_QUEUE"
queue   = "parse-queue"         # 【按域名修改】建议 parse-queue-<domain>

[[queues.producers]]
binding = "SEND_QUEUE"
queue   = "send-queue"          # 【按域名修改】建议 send-queue-<domain>

# ─── Queue 消费者 ─────────────────────────────────────────────────────────────
# 同一个 Worker 同时消费这 4 个队列：parse / send / parse-dlq / send-dlq。
# parse：单次 invocation 内并行解析 PARSE_PARALLELISM 个文件（max_batch_size 须 ≥ 该值）。
[[queues.consumers]]
queue              = "parse-queue"   # 【按域名修改】与上方 producer 一致
max_batch_size     = 2
max_batch_timeout  = 5
max_retries        = 5               # 超过后进 parse-dlq，由 DLQ 重驱动自动回灌
dead_letter_queue  = "parse-dlq"     # 【按域名修改】建议 parse-dlq-<domain>

# send：单次 invocation 取多个待发批次，内部用 SEND_PARALLELISM 小并发池发送。
[[queues.consumers]]
queue              = "send-queue"    # 【按域名修改】与上方 producer 一致
max_batch_size     = 50
max_batch_timeout  = 5
max_retries        = 5               # 超过后进 send-dlq，由 DLQ 重驱动自动回灌
dead_letter_queue  = "send-dlq"      # 【按域名修改】建议 send-dlq-<domain>

# parse-dlq / send-dlq：本 Worker 消费它们，把死信按指数退避+抖动回灌源队列；自身不设 dead_letter_queue。
[[queues.consumers]]
queue              = "parse-dlq"     # 【按域名修改】与 parse-queue 的 dead_letter_queue 一致
max_batch_size     = 10
max_batch_timeout  = 30
max_retries        = 10
max_concurrency    = 1

[[queues.consumers]]
queue              = "send-dlq"      # 【按域名修改】与 send-queue 的 dead_letter_queue 一致
max_batch_size     = 10
max_batch_timeout  = 30
max_retries        = 10
max_concurrency    = 1

# ─── 环境变量 ─────────────────────────────────────────────────────────────────
# 4 个队列名必须与上方 producers / consumers 的 queue 名一一对应。
# FIELD11_SERVER_IP 每个域名各自填；其余变量都有合理默认，一般无需改动。
[vars]
PARSE_QUEUE_NAME = "parse-queue"     # 【按域名修改】= 上方 parse 队列名
SEND_QUEUE_NAME  = "send-queue"      # 【按域名修改】= 上方 send 队列名
PARSE_DLQ_NAME   = "parse-dlq"       # 【按域名修改】= parse-queue 的 dead_letter_queue
SEND_DLQ_NAME    = "send-dlq"        # 【按域名修改】= send-queue 的 dead_letter_queue
R2_BUCKET_NAME   = "cdn-logs-raw"   # 【按域名修改】= 上方 [[r2_buckets]] bucket_name
BATCH_SIZE       = "2000"            # 每批行数（每批一次 POST）。改此值前先清空 DLQ，避免破坏 .done 幂等
RAW_LOG_PREFIX   = "logs/"          # 只处理此前缀的 R2 原始日志对象
RAW_LOG_SUFFIX   = ".log.gz"        # 只处理此后缀的 R2 原始日志对象
LOG_LEVEL        = "info"
PUSH_START_TIME  = ""                # 留空=推送全部新日志。未来时间=到点开始推；过去时间=部署后扫 R2 补传历史（ISO 8601）
FIELD11_SERVER_IP = ""               # 【按域名必填】该域名的 anycast/解析 IP，写入日志第 11 字段 server_ip；留空则输出 "-"
SEND_PARALLELISM = "2"               # send 单次 invocation 内并发 POST 数（1=串行；上限 8）
PARSE_PARALLELISM = "2"              # parse 单次 invocation 内并行解析文件数（须 ≤ parse max_batch_size；上限 8）
PARSE_READ_IDLE_TIMEOUT_MS = "45000" # 单次 R2 read() 空闲超时(ms)，超时只重试该文件；0=不限
SEND_FETCH_TIMEOUT_MS = "30000"      # 单次发送 fetch 超时(ms)
RETRY_DELAY_SECONDS = "30"           # 失败重试延迟(s)
REDRIVE_BASE_DELAY_SECONDS = "60"    # DLQ 重驱动退避基数(s)
REDRIVE_MAX_DELAY_SECONDS  = "3600"  # DLQ 重驱动退避封顶(s)
REDRIVE_JITTER_SECONDS     = "30"    # DLQ 重驱动抖动(s)

# ─── Cron 触发器 ─────────────────────────────────────────────────────────────
# 每分钟触发 scheduled handler；仅当 PUSH_START_TIME 为过去时间且未执行过时扫描补传，其余情况秒级返回。
[triggers]
crons = ["* * * * *"]

# ─── Observability（Workers Logs）─────────────────────────────────────────────
# 100% 采样，便于回看 invocation 上下文（数据按 CF 默认策略保留）。
[observability]
enabled = true
head_sampling_rate = 1
[observability.logs]
enabled         = true
invocation_logs = true

# ─── CPU 时间上限 ─────────────────────────────────────────────────────────────
# Enterprise 上限 5 分钟（300000ms）；流式解析单次 CPU 远低于此，留足余量。
[limits]
cpu_ms = 300000
